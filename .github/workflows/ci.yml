name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t api-stages .
      - name: Lancer le conteneur et vérifier /health
        run: |
          docker run -d --name api -p 8000:8000 api-stages
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
